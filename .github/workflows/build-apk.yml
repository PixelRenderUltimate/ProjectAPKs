name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK"     >> "$GITHUB_ENV"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager tidak ditemukan"; exit 1; fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept licenses and install SDK packages
        run: |
          set -e
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      # Juga memvalidasi gradle-wrapper.jar terhadap checksum resmi Gradle.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Upload lewat web GitHub menghapus bit eksekusi.
      - name: Make gradlew executable
        run: chmod +x gradlew

      # Test SEBELUM build: kalau jaminan keamanan rusak, APK tidak dibuat.
      # Output disalin ke gradle.log supaya error bisa diringkas di akhir.
      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee -a gradle.log

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee -a gradle.log

      # Pesan error asli sering tenggelam di ratusan baris stack trace.
      # Langkah ini menaruh baris pentingnya di halaman Summary run.
      - name: Ringkasan error
        if: failure()
        shell: bash
        run: |
          touch gradle.log
          PATTERN='^e: |ERROR:|error:|What went wrong|Execution failed for task|> Task .* FAILED|There were failing tests|Caused by: '
          {
            echo "## Build gagal - baris penting"
            echo '```'
            grep -E "$PATTERN" gradle.log | grep -vE '^\s+at |^\s+\.\.\. [0-9]+ more' | awk '!seen[$0]++' | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "$PATTERN" gradle.log | grep -vE '^\s+at ' | awk '!seen[$0]++' | head -80 || true

      - name: Rename APK
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/debug/*.apk "artifact/PixelRender-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelRender-debug-apk
          path: artifact/*.apk
          if-no-files-found: error

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/outputs/logs/
            app/.cxx/
          if-no-files-found: ignore
